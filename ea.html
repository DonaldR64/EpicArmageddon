<script type="text/worker">
    const buttonlist = ["input","display"];
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });

    on("sheet:opened", function() {
        setAttrs({sheetTab:"display"});
    });

    on("change:attrs sheet:opened", function() { 
        getAttrs(["special","character_name","criticalhit","weapon2name","weapon3name","weapon4name","weapon5name","weapon6name"], function(values) {
            
            let name = values.character_name;
            name = name.split("//")[0].trim();

            let specials = values.special || "Nil";
            specials = specials.split(";");
            let special = new Array(5);
            for (let i=0;i<specials.length;i++) {
                special[i] = specials[i].trim();
            }
            let crit;
            if (values.criticalhit) {
                crit = "Critical Hit: " + values.criticalhit;
            }

            let w2name = values.weapon2name;
            let w3name = values.weapon3name;
            let w4name = values.weapon4name;
            let w5name = values.weapon5name;
            let w6name = values.weapon6name;

            let w2c = "white";
            if (!w2name || w2name === "") {w2c = "lightgrey"};
            let w3c = (w2c === "white") ? "lightgrey":"white";
            if (!w3name || w3name === "") {w3c = w2c};
            let w4c = (w3c === "white") ? "lightgrey":"white";
            if (!w4name || w4name === "") {w4c = w3c};
            let w5c = (w4c === "white") ? "lightgrey":"white";
            if (!w5name || w5name === "") {w5c = w4c};
            let w6c = (w5c === "white") ? "lightgrey":"white";
            if (!w6name || w6name === "") {w6c = w5c};


            setAttrs({
                "special0": special[0],
                "special1": special[1],
                "special2": special[2],
                "special3": special[3],
                "special4": special[4],
                "displayname": name,
                "criticalhitdisplay": crit,
                "wpn2colour": w2c,
                "wpn3colour": w3c,
                "wpn4colour": w4c,
                "wpn5colour": w5c,
                "wpn6colour": w6c,


            });
        });    
    }); 


 

</script>
